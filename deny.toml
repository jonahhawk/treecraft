# cargo-deny: keeps dependencies on permissive/OSI licenses and free of known advisories.
[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # ttf-parser is unmaintained, with no fixed release. It comes in through egui and winit's
    # font rendering (ab_glyph) and only parses fonts bundled with the app or the system theme.
    # Revisit when egui moves to skrifa.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained, no alternative in egui yet; parses trusted fonts only" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    # Fonts bundled by egui (Ubuntu and Hack/emoji fonts).
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates depend on each other by path without a version; none are published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
