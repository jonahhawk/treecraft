[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
# Internal crates
tc-model = { path = "crates/tc-model" }
tc-scan = { path = "crates/tc-scan" }
tc-scan-win = { path = "crates/tc-scan-win" }
tc-ntfs = { path = "crates/tc-ntfs" }
tc-analysis = { path = "crates/tc-analysis" }
tc-snapshot = { path = "crates/tc-snapshot" }
tc-export = { path = "crates/tc-export" }

# External crates
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
thiserror = "2"
eframe = "0.36"
egui_extras = "0.36"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
trash = "5"
windows-sys = "0.61"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# Keep tests and benches of the hot paths reasonably fast.
[profile.dev.package."*"]
opt-level = 2
