[package]
name = "tc-gui"
description = "Treecraft desktop GUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "treecraft-gui"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
eframe.workspace = true
egui_extras.workspace = true
tc-analysis.workspace = true
tc-model.workspace = true
tc-scan.workspace = true
tc-scan-win.workspace = true
trash.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    # SHELLEXECUTEINFOW has a registry-key field, so ShellExecuteExW needs this feature too.
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
